<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidPlus MoviePlayer – Vanilla Example</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #111;
      color: #eee;
    }
    h1 { font-size: 1.5rem; }
    #player {
      max-width: 800px;
      margin: 1.5rem 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    button {
      background: #6C63FF;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>VidPlus MoviePlayer – Vanilla JS</h1>
  <p>Inception (TMDB 27205)</p>

  <div id="player"></div>

  <div class="controls">
    <button id="btn-update">Jump to 2:00</button>
    <button id="btn-destroy">Destroy</button>
  </div>

  <script type="module">
    // After building locally:
    // import { createMoviePlayer } from '../dist/vanilla.mjs';

    // In a real app, import from the package:
    // import { createMoviePlayer } from 'vidplus-movie-player/vanilla';
  </script>
</body>
</html>
