<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidUp MoviePlayer – Vanilla Example</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #111;
      color: #eee;
    }

    #player {
      max-width: 800px;
      margin: 1.5rem 0;
      border-radius: 12px;
      overflow: hidden;
    }

    button {
      margin-right: 0.5rem;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>VidUp MoviePlayer – Vanilla JS</h1>
  <p>I Am Legend (IMDb tt0480249)</p>

  <div id="player"></div>

  <button id="jump">Reload at 2:00</button>
  <button id="destroy">Destroy</button>

  <script type="module">
    // After building locally:
    import { createMoviePlayer } from '../dist/vanilla.mjs';

    const player = createMoviePlayer('#player', {
      type: 'movie',
      id: 'tt0480249',
      autoPlay: false,
      theme: 'E50914',
      sub: 'en',
      titleAttr: 'I Am Legend — VidUp player',
    });

    document.querySelector('#jump').addEventListener('click', () => {
      player.update({ startAt: 120 });
    });

    document.querySelector('#destroy').addEventListener('click', () => {
      player.destroy();
    });
  </script>
</body>
</html>
